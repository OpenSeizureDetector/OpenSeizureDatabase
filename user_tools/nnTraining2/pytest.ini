[pytest]
filterwarnings =
    # --- Environmental noise: not actionable in this repo, hidden for clean output ---
    # multiprocessing.Pool forks inside test processes that already run torch
    # thread pools (extractFeatures / streaming / runSequence tests). The deeper
    # fix would be migrating those pools to the "spawn" start method, which is a
    # bigger behavioural change (spawn requires fully picklable worker args).
    ignore:.*is multi-threaded, use of fork.*:DeprecationWarning
    # torchviz still uses distutils LooseVersion; fixed upstream by upgrading
    # torchviz (this venv pins the old release).
    ignore:.*distutils Version classes are deprecated.*:DeprecationWarning
    # torch>=2.13 deprecates torch.jit.trace (used by the .ptl converter);
    # migration to torch.export is the separate .pte project, so the converter
    # legitimately still uses it.
    ignore:.*torch\.jit\.trace.*deprecated.*:DeprecationWarning
    # torch>=2.13 deprecates the Lite Interpreter itself (the .ptl format this
    # pipeline intentionally still produces as a fallback; ExecuTorch
    # migration is separate).
    ignore:.*Lite Interpreter is deprecated.*:DeprecationWarning
    # keras internal use of np.object (third-party, new-keras/NumPy friction).
    ignore:.*np\.object.*will be defined as.*:FutureWarning
